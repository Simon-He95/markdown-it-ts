name: Perf Regression

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/perf-regression.yml
      - src/**
      - scripts/perf-*.mjs
      - test/parse/parse-performance.test.ts
      - package.json
      - pnpm-lock.yaml
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref to compare against
        required: false
        default: main
      head_ref:
        description: Head ref to test; empty means current workflow ref
        required: false
        default: ''

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_ref || github.sha }}
          path: head
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ github.ref }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install deps (head)
        run: pnpm -C head install --frozen-lockfile

      - name: Fetch baseline ref
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref || 'main' }}
        run: git -C head fetch --no-tags origin "$BASE_REF:refs/perf/base"

      - name: Run parser perf threshold tests (head)
        run: pnpm -C head run test:perf-threshold

      - name: Compare parser and renderer against base
        run: pnpm -C head run perf:compare:ref -- refs/perf/base --rounds=3 --threshold=0.05

      - name: Compare streaming against base
        run: pnpm -C head run perf:compare:stream-ref -- refs/perf/base --rounds=3 --threshold=0.05
